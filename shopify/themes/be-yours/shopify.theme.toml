# Shopify CLI theme environments for the Lush Qatar store.
#
# Do NOT run `shopify theme` directly against these — use ../theme.sh, which
# enforces the code/content split described in docs/theme-phase.md.
#
# Theme Access passwords are deliberately absent here: they live in ../.env
# (gitignored) and reach the CLI via SHOPIFY_CLI_THEME_TOKEN, never as a
# command-line argument (those are visible to any local user via `ps`).
#
# Theme IDs confirmed 2026-08-03. Re-check them any time with:
#   ../theme.sh list

[environments.build]
# "Be Yours - Lush Qatar (by DotAim)" — Be Yours 9.2.0, the one theme we work
# on. Created 2026-08-03 as a duplicate of the previous live theme, published
# 2026-08-04. Pre-launch it is both the build target and the published theme:
# the storefront is password-protected, so there is nothing to shield from
# customers, and a single clearly named theme is easier for the client to
# follow. Pushes therefore pass --allow-live; the safety net is the pre-push
# snapshot plus the git baseline.
store = "lush-qatar.myshopify.com"
theme = "152710447243"

[environments.vanilla]
# "Be Yours" — 9.1.0, verified untouched (settings_data still on the "Be Yours"
# preset). Our diff baseline. Never edited, never pushed to.
# One minor version behind the live 9.2.0 — account for that when diffing.
store = "lush-qatar.myshopify.com"
theme = "152138383499"
